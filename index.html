<!-- BANNER + KHỐI NẠP THẺ ĐÃ ĐỨNG ĐÚNG VỊ TRÍ -->
<div class="banner-recharge-wrap">
    <div class="banner-col">
        <img src="banner-main.jpg" alt="SHOP DỊCH VỤ ROBLOX GIÁ RẺ" class="banner-img">
    </div>
    <div class="recharge-col">
        <h4>TOP NẠP T.07</h4>
        <div class="recharge-tabs">
            <button class="tab-btn active" onclick="switchTab('nap')">Nạp thẻ</button>
            <button class="tab-btn" onclick="switchTab('thang')">Tháng này</button>
            <button class="tab-btn" onclick="switchTab('thuong')">Phần thưởng</button>
        </div>

        <div id="tab-nap" class="tab-content">
            <input type="text" placeholder="Viettel" class="recharge-input">
            <input type="text" placeholder="-- Chọn đúng mệnh giá --" class="recharge-input">
            <input type="text" placeholder="Nhập mã thẻ" class="recharge-input">
            <input type="text" placeholder="Nhập số serial" class="recharge-input">
            <button class="recharge-btn">NẠP THẺ NGAY</button>
            <p class="note-text">⚠ Chỉ là giao diện ví dụ – Khi có hệ thống sẽ qua Zalo bên dưới</p>
        </div>

        <div id="tab-thang" class="tab-content" style="display:none;">
            <div class="empty-text">Chưa có dữ liệu nạp thẻ tháng này</div>
        </div>

        <div id="tab-thuong" class="tab-content" style="display:none;">
            <p class="reward-title">ĐỰA TOP NẠP THẺ HÀNG TUẦN - THƯỞNG HÀNG TUẦN</p>
            <div class="empty-text">Sẽ công bố sau khi chốt số liệu</div>
        </div>
    </div>
</div>
